<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공정표 | 관리자페이지</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="schedule.html">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <h1>공정표</h1>
    <p class="sub">현장별 공정 일정과 특이사항을 달력으로 관리합니다</p>

    <div class="card">
      <h2>현장 보기</h2>
      <p class="sub" style="margin-bottom:14px;">현장을 누르면 그 현장 일정만 달력에 강조되고, 진행률과 비고를 볼 수 있어요</p>
      <div class="filterrow" id="site-filters"></div>
    </div>

    <div id="site-panel"></div>

    <div class="card">
      <div class="cal-header">
        <div class="cal-nav">
          <button class="btn btn-ghost btn-sm" id="prev-month">이전달</button>
          <button class="btn btn-ghost btn-sm" id="today-btn">이번달</button>
          <button class="btn btn-ghost btn-sm" id="next-month">다음달</button>
        </div>
        <div class="title" id="cal-title">-</div>
        <div style="width:180px;"></div>
      </div>
      <div id="daygrid-view">
        <div class="cal-grid" id="cal-dow-row">
          <div class="cal-dow" style="color:#c0392b;">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
          <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow" style="color:#2b5fc0;">토</div>
        </div>
        <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
      </div>
      <div id="table-view" style="display:none;"></div>
      <p class="sub" style="margin-top:10px;margin-bottom:0;">날짜를 누르면 (또는 기존 일정을 누르면) 아래에 입력창이 나타납니다.</p>
    </div>

    <div id="entry-panel" style="display:none;">
      <div class="card">
        <h2 id="form-title">일정 등록</h2>
        <form id="schedule-form">
          <input type="hidden" name="id">
          <div class="form-grid cols-4">
            <div><label>날짜 *</label><input type="date" name="item_date" required></div>
            <div style="grid-column:2/4;"><label>현장</label>
              <select name="customer_id" id="customer-select">
                <option value="">특이사항 (현장 없음)</option>
              </select>
            </div>
          </div>
          <div class="form-grid" style="margin-top:12px;">
            <div style="grid-column:1/-1;"><label>내용 *</label><input type="text" name="content" required placeholder="예: 타일, 필름, 도배 / 또는 메모 내용"></div>
          </div>
          <div class="form-grid" style="margin-top:12px;">
            <div><label class="check-label"><input type="checkbox" name="confirmed"> 작업자 확정됨</label></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">등록하기</button>
            <button type="button" class="btn btn-ghost" id="cancel-edit">취소</button>
            <button type="button" class="btn btn-ghost" id="delete-btn" style="display:none;color:#c0392b;">삭제</button>
          </div>
        </form>

        <div class="quickadd-head">
          <span class="remarklabel" style="margin:0;">빠른 추가 <small style="font-weight:400;">(눌렀을 때 바로 등록됩니다)</small></span>
          <button type="button" class="btn btn-ghost btn-sm" id="cat-edit-toggle">카테고리 편집</button>
        </div>
        <div class="quickadd-grid" id="quickadd-grid"></div>
        <div id="cat-add-row" style="display:none;margin-top:10px;gap:8px;align-items:center;">
          <input type="color" id="new-cat-color" value="#888888" style="width:40px;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;">
          <input type="text" id="new-cat-name" placeholder="새 카테고리 이름" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:5px;font-size:14px;">
          <button type="button" class="btn btn-primary btn-sm" id="new-cat-add">추가</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin-common.js"></script>
<script>
let editingId = null;
let customersCache = [];
let categoriesCache = [];
let catEditMode = false;
let viewYear, viewMonth; // viewMonth: 1-12
let selectedCustomerId = null;

// 색상끼리 최대한 겹치지 않도록 색상환에서 고르게 떨어진 12색
const SITE_COLORS = ["#4E79A7","#F28E2B","#59A14F","#E15759","#B07AA1","#9C755F","#76B7B2","#D37295","#EDC948","#6B6ECF","#BAB0AC","#B5544A"];
function colorFor(id){ return SITE_COLORS[id % SITE_COLORS.length]; }

// 2026년 대한민국 공휴일(대체공휴일 포함, YYYY-MM-DD)
const HOLIDAYS_2026 = new Set([
  "2026-01-01", // 신정
  "2026-02-16","2026-02-17","2026-02-18", // 설날 연휴
  "2026-03-01","2026-03-02", // 삼일절 + 대체공휴일
  "2026-05-05", // 어린이날
  "2026-05-24","2026-05-25", // 부처님오신날 + 대체공휴일
  "2026-06-06", // 현충일
  "2026-08-15","2026-08-17", // 광복절 + 대체공휴일
  "2026-09-24","2026-09-25","2026-09-26", // 추석 연휴
  "2026-10-03","2026-10-05", // 개천절 + 대체공휴일
  "2026-10-09", // 한글날
  "2026-12-25", // 성탄절
]);
function isHoliday(dateStr){ return HOLIDAYS_2026.has(dateStr); }
const DOW_LABELS = ["일","월","화","수","목","금","토"];

function pad2(n) { return String(n).padStart(2, "0"); }
function toISO(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }

async function loadCustomerOptions() {
  const { data } = await sbClient.from("customers").select("id,name,remark").order("created_at", { ascending: false });
  customersCache = data || [];
  const sel = document.getElementById("customer-select");
  sel.innerHTML = `<option value="">이슈 / 메모 (현장 없음)</option>` +
    customersCache.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  renderFilters();
}
function customerName(id) {
  if (!id) return null;
  const c = customersCache.find(x => x.id === id);
  return c ? c.name : "-";
}

async function loadCategories() {
  const { data } = await sbClient.from("schedule_categories").select("*").order("sort_order", { ascending: true });
  categoriesCache = data || [];
  renderQuickAdd();
}

let dragSrcId = null;

function renderQuickAdd() {
  const grid = document.getElementById("quickadd-grid");
  grid.innerHTML = categoriesCache.map(cat => `
    <button type="button" class="qa-chip${catEditMode ? " draggable" : ""}" data-id="${cat.id}"
      ${catEditMode ? 'draggable="true"' : ""} style="border-color:${cat.color};color:${cat.color};">
      <span class="dot" style="background:${cat.color}"></span>${cat.name}
      ${catEditMode ? `<span class="qa-del" data-id="${cat.id}">×</span>` : ""}
    </button>
  `).join("");

  if (catEditMode) {
    grid.querySelectorAll(".qa-chip").forEach(btn => {
      btn.addEventListener("dragstart", () => {
        dragSrcId = Number(btn.dataset.id);
        btn.classList.add("dragging");
      });
      btn.addEventListener("dragend", () => btn.classList.remove("dragging"));
      btn.addEventListener("dragover", (e) => e.preventDefault());
      btn.addEventListener("drop", async (e) => {
        e.preventDefault();
        const targetId = Number(btn.dataset.id);
        if (dragSrcId === null || dragSrcId === targetId) return;
        const srcIdx = categoriesCache.findIndex(c => c.id === dragSrcId);
        const tgtIdx = categoriesCache.findIndex(c => c.id === targetId);
        const [moved] = categoriesCache.splice(srcIdx, 1);
        categoriesCache.splice(tgtIdx, 0, moved);
        categoriesCache.forEach((c, i) => c.sort_order = i + 1);
        renderQuickAdd();
        await Promise.all(categoriesCache.map(c =>
          sbClient.from("schedule_categories").update({ sort_order: c.sort_order }).eq("id", c.id)
        ));
      });
    });
  }

  grid.querySelectorAll(".qa-chip").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      if (e.target.classList.contains("qa-del")) return; // handled separately
      const cat = categoriesCache.find(c => c.id === Number(btn.dataset.id));
      if (catEditMode) {
        const newName = prompt("카테고리 이름 수정", cat.name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed) { alert("이름은 비워둘 수 없어요."); return; }
        const { error } = await sbClient.from("schedule_categories").update({ name: trimmed }).eq("id", cat.id);
        if (error) { alert("수정 실패: " + error.message); return; }
        loadCategories();
        return;
      }
      const form = document.getElementById("schedule-form");
      form.content.value = cat.name;
      if (form.item_date.value) {
        document.getElementById("schedule-form").requestSubmit();
      } else {
        alert("먼저 날짜를 선택해주세요. 내용칸에 \"" + cat.name + "\"을 넣어뒀어요.");
      }
    });
  });
  grid.querySelectorAll(".qa-del").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = Number(el.dataset.id);
      const cat = categoriesCache.find(c => c.id === id);
      if (!confirm(`"${cat.name}" 카테고리를 삭제하시겠습니까?`)) return;
      const { error } = await sbClient.from("schedule_categories").delete().eq("id", id);
      if (error) { alert("삭제 실패: " + error.message); return; }
      loadCategories();
    });
  });
}

function renderFilters(){
  const row = document.getElementById("site-filters");
  const allChip = `<div class="chip ${selectedCustomerId===null?'selected':''}" data-id="">전체 보기</div>`;
  const chips = customersCache.map(c=>{
    const color = colorFor(c.id);
    const sel = selectedCustomerId===c.id ? "selected" : "";
    return `<div class="chip ${sel}" data-id="${c.id}" style="color:${color}"><span class="dot" style="background:${color}"></span>${c.name}</div>`;
  }).join("");
  row.innerHTML = allChip + chips;
  row.querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idAttr = el.dataset.id;
      selectedCustomerId = idAttr === "" ? null : Number(idAttr);
      renderFilters();
      renderSitePanel();
      loadAndRenderCalendar();
    });
  });
}

async function renderSitePanel(){
  const box = document.getElementById("site-panel");
  if (selectedCustomerId === null) { box.innerHTML = ""; return; }
  const c = customersCache.find(x => x.id === selectedCustomerId);
  if (!c) { box.innerHTML = ""; return; }
  const color = colorFor(selectedCustomerId);

  const [{ data: firstRows }, { data: lastRows }] = await Promise.all([
    sbClient.from("schedule_items").select("item_date").eq("customer_id", selectedCustomerId).order("item_date", { ascending: true }).limit(1),
    sbClient.from("schedule_items").select("item_date").eq("customer_id", selectedCustomerId).order("item_date", { ascending: false }).limit(1)
  ]);

  let pctHtml = `<div class="pct">아직 등록된 일정이 없어요.</div>`;
  if (firstRows?.length && lastRows?.length) {
    const first = new Date(firstRows[0].item_date);
    const last = new Date(lastRows[0].item_date);
    const today = new Date();
    const total = last - first;
    const elapsed = Math.min(Math.max(today - first, 0), total);
    const pct = total > 0 ? Math.round((elapsed / total) * 100) : (today >= last ? 100 : 0);
    pctHtml = `<div class="pct">공사 진행률 <b>${pct}%</b></div>
      <div class="progressbar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>`;
  }

  box.innerHTML = `
    <div class="card sitepanel">
      <div class="sname" style="color:${color}">${c.name}</div>
      ${pctHtml}
      <div class="remarklabel">비고 (자유롭게 적으면 자동 저장됩니다)</div>
      <textarea class="remarkbox" id="remark-input" placeholder="예: 클라이언트 특이사항, 자재 대금 확인 필요 등">${c.remark || ""}</textarea>
      <div class="savedhint" id="remark-saved">저장됨</div>
    </div>`;

  const ta = document.getElementById("remark-input");
  let saveTimer;
  ta.addEventListener("input", () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const { error } = await sbClient.from("customers").update({ remark: ta.value }).eq("id", selectedCustomerId);
      if (!error) {
        c.remark = ta.value;
        const hint = document.getElementById("remark-saved");
        hint.classList.add("show");
        setTimeout(() => hint.classList.remove("show"), 1200);
      }
    }, 500);
  });
}

async function loadAndRenderCalendar() {
  document.getElementById("cal-title").textContent = `${viewYear}년 ${viewMonth}월`;
  const monthStart = toISO(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const monthEnd = toISO(viewYear, viewMonth, daysInMonth);

  const { data } = await sbClient
    .from("schedule_items")
    .select("*")
    .gte("item_date", monthStart)
    .lte("item_date", monthEnd)
    .order("id", { ascending: true });

  document.getElementById("daygrid-view").style.display = selectedCustomerId === null ? "none" : "block";
  document.getElementById("table-view").style.display = selectedCustomerId === null ? "block" : "none";

  if (selectedCustomerId === null) {
    renderSiteTable(data || [], daysInMonth);
  } else {
    renderDayGrid(data || [], daysInMonth);
  }
}

function renderDayGrid(data, daysInMonth) {
  const itemsByDate = {};
  data.forEach(it => { (itemsByDate[it.item_date] = itemsByDate[it.item_date] || []).push(it); });

  const firstDow = new Date(viewYear, viewMonth - 1, 1).getDay();
  const grid = document.getElementById("cal-grid");
  const todayStr = new Date().toISOString().slice(0, 10);
  let html = "";

  for (let i = 0; i < firstDow; i++) html += `<div class="cal-cell empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = toISO(viewYear, viewMonth, d);
    const shown = (itemsByDate[dateStr] || []).filter(it => it.customer_id === selectedCustomerId);
    const isToday = dateStr === todayStr ? "today" : "";
    const dim = shown.length === 0 ? "dim" : "";
    const itemsHtml = shown.map(it => {
      const confirmMark = `<span class="confirm-toggle ${it.confirmed ? "on" : ""}" data-toggle-id="${it.id}" title="${it.confirmed ? "확정됨 (눌러서 취소)" : "미확정 (눌러서 확정)"}">${it.confirmed ? "●" : "○"}</span>`;
      return `<div class="cal-item" data-id="${it.id}">${confirmMark}${it.content}</div>`;
    }).join("");
    const dow = new Date(viewYear, viewMonth - 1, d).getDay();
    let daynumColor = "";
    if (isHoliday(dateStr) || dow === 0) daynumColor = "#c0392b";
    else if (dow === 6) daynumColor = "#2b5fc0";
    html += `
      <div class="cal-cell ${isToday} ${dim}" data-date="${dateStr}">
        <div class="daynum"${daynumColor ? ` style="color:${daynumColor};"` : ""}>${d}</div>
        ${itemsHtml}
        <div class="cal-add-link" data-date="${dateStr}">+ 추가</div>
      </div>`;
  }

  grid.innerHTML = html;

  grid.querySelectorAll(".cal-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("confirm-toggle")) return;
      const id = Number(el.dataset.id);
      const item = data.find(x => x.id === id);
      if (item) openEntryPanel(null, item);
    });
  });
  grid.querySelectorAll(".confirm-toggle").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = Number(el.dataset.toggleId);
      const item = data.find(x => x.id === id);
      if (!item) return;
      const { error } = await sbClient.from("schedule_items").update({ confirmed: !item.confirmed }).eq("id", id);
      if (error) { alert("변경 실패: " + error.message); return; }
      loadAndRenderCalendar();
    });
  });
  grid.querySelectorAll(".cal-add-link").forEach(el => {
    el.addEventListener("click", () => openEntryPanel(el.dataset.date, null));
  });
}

function renderSiteTable(data, daysInMonth) {
  const todayStr = new Date().toISOString().slice(0, 10);

  const itemsByKey = {}; // `${date}|${customerId||issue}` -> items[]
  data.forEach(it => {
    const key = `${it.item_date}|${it.customer_id || "issue"}`;
    (itemsByKey[key] = itemsByKey[key] || []).push(it);
  });

  const activeSiteIds = [...new Set(data.filter(it => it.customer_id).map(it => it.customer_id))];
  const sites = customersCache.filter(c => activeSiteIds.includes(c.id));
  const hasIssue = data.some(it => !it.customer_id);

  let headRow = `<th class="sitecol">현장</th>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = toISO(viewYear, viewMonth, d);
    const dow = new Date(viewYear, viewMonth - 1, d).getDay();
    let c = "";
    if (isHoliday(dateStr) || dow === 0) c = "color:#c0392b;";
    else if (dow === 6) c = "color:#2b5fc0;";
    const todayBg = dateStr === todayStr ? "background:#eaf5ea;" : "";
    headRow += `<th style="${c}${todayBg}">${d}<br><span style="font-weight:400;font-size:10px;">${DOW_LABELS[dow]}</span></th>`;
  }

  function rowCells(key, color) {
    let cells = "";
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = toISO(viewYear, viewMonth, d);
      const items = itemsByKey[`${dateStr}|${key}`] || [];
      const todayBg = dateStr === todayStr ? "background:#eaf5ea;" : "";
      const chips = items.map(it =>
        `<span class="cell-chip" data-id="${it.id}" style="background:${color}22;color:${color};">${it.confirmed ? "● " : ""}${it.content}</span>`
      ).join("");
      cells += `<td style="${todayBg}" data-date="${dateStr}" data-site="${key === "issue" ? "" : key}">${chips}</td>`;
    }
    return cells;
  }

  let bodyRows = sites.map(site => {
    const color = colorFor(site.id);
    return `<tr><td class="sitecol" data-id="${site.id}" style="color:${color};">${site.name}</td>${rowCells(site.id, color)}</tr>`;
  }).join("");
  if (hasIssue) {
    bodyRows += `<tr><td class="sitecol" style="color:var(--sub);">특이사항</td>${rowCells("issue", "#71695f")}</tr>`;
  }
  if (!bodyRows) {
    bodyRows = `<tr><td class="sitecol" style="color:var(--sub);">등록된 일정 없음</td>${Array.from({length:daysInMonth}, () => "<td></td>").join("")}</tr>`;
  }

  document.getElementById("table-view").innerHTML = `
    <div class="sched-table-wrap"><table class="sched-table">
      <thead><tr>${headRow}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table></div>`;

  document.querySelectorAll(".sched-table td.sitecol[data-id]").forEach(el => {
    el.addEventListener("click", () => {
      selectedCustomerId = Number(el.dataset.id);
      renderFilters();
      renderSitePanel();
      loadAndRenderCalendar();
    });
  });
  document.querySelectorAll(".cell-chip").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = data.find(x => x.id === Number(el.dataset.id));
      if (item) openEntryPanel(null, item);
    });
  });
  document.querySelectorAll(".sched-table td[data-date]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("cell-chip")) return;
      openEntryPanel(el.dataset.date, null);
      if (el.dataset.site) document.getElementById("customer-select").value = el.dataset.site;
    });
  });
}

function setForm(dateStr, item) {
  const form = document.getElementById("schedule-form");
  form.reset();
  editingId = item ? item.id : null;
  form.item_date.value = dateStr || item?.item_date || "";
  form.customer_id.value = item?.customer_id || "";
  form.content.value = item?.content || "";
  form.confirmed.checked = item?.confirmed || false;
  document.getElementById("form-title").textContent = editingId ? "일정 수정" : "일정 등록";
  document.getElementById("submit-btn").textContent = editingId ? "수정 저장" : "등록하기";
  document.getElementById("delete-btn").style.display = editingId ? "inline-flex" : "none";
}
function openEntryPanel(dateStr, item) {
  document.getElementById("entry-panel").style.display = "block";
  setForm(dateStr, item);
  document.getElementById("entry-panel").scrollIntoView({ behavior: "smooth", block: "start" });
}
function resetForm() {
  setForm(null, null);
  document.getElementById("entry-panel").style.display = "none";
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  loadAndRenderCalendar();
}

(async () => {
  const auth = await requireAuth();
  if (!auth) return;

  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;

  await loadCustomerOptions();
  await loadCategories();
  await loadAndRenderCalendar();

  document.getElementById("cat-edit-toggle").addEventListener("click", () => {
    catEditMode = !catEditMode;
    document.getElementById("cat-edit-toggle").textContent = catEditMode ? "완료" : "카테고리 편집";
    document.getElementById("cat-add-row").style.display = catEditMode ? "flex" : "none";
    renderQuickAdd();
  });
  document.getElementById("new-cat-add").addEventListener("click", async () => {
    const nameInput = document.getElementById("new-cat-name");
    const colorInput = document.getElementById("new-cat-color");
    const name = nameInput.value.trim();
    if (!name) { alert("카테고리 이름을 입력해주세요."); return; }
    const sortOrder = categoriesCache.length ? Math.max(...categoriesCache.map(c => c.sort_order || 0)) + 1 : 1;
    const { error } = await sbClient.from("schedule_categories").insert([{ name, color: colorInput.value, sort_order: sortOrder }]);
    if (error) { alert("추가 실패: " + error.message); return; }
    nameInput.value = "";
    loadCategories();
  });

  document.getElementById("prev-month").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));
  document.getElementById("today-btn").addEventListener("click", () => {
    const n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth() + 1;
    loadAndRenderCalendar();
  });
  document.getElementById("cancel-edit").addEventListener("click", resetForm);

  document.getElementById("delete-btn").addEventListener("click", async () => {
    if (!editingId) return;
    if (!confirm("이 일정을 삭제하시겠습니까?")) return;
    const { error } = await sbClient.from("schedule_items").delete().eq("id", editingId);
    if (error) { alert("삭제 실패: " + error.message); return; }
    resetForm();
    loadAndRenderCalendar();
  });

  document.getElementById("schedule-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      item_date: form.item_date.value,
      customer_id: form.customer_id.value || null,
      content: form.content.value,
      confirmed: form.confirmed.checked
    };
    let result;
    if (editingId) {
      result = await sbClient.from("schedule_items").update(payload).eq("id", editingId);
    } else {
      payload.created_by = auth.user.id;
      result = await sbClient.from("schedule_items").insert([payload]);
    }
    if (result.error) { alert("저장 실패: " + result.error.message); return; }
    resetForm();
    loadAndRenderCalendar();
  });
})();
</script>
</body>
</html>
