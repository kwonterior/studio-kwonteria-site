<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자재발주 관리 | 관리자페이지</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="materials.html">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <h1>자재발주 관리</h1>
    <p class="sub">현장별 자재 발주 내역과 도착 여부를 기록합니다</p>

    <div class="card">
      <h2 id="form-title">새 발주 등록</h2>
      <form id="material-form">
        <input type="hidden" name="id">
        <div class="form-grid cols-4">
          <div><label>고객/현장 *</label>
            <select name="customer_id" required id="customer-select"></select>
          </div>
          <div><label>발주 업체</label><input type="text" name="vendor_name" placeholder="예: ○○자재상"></div>
          <div><label>품목</label><input type="text" name="item" placeholder="예: 마루, 타일 등"></div>
          <div><label>수량</label><input type="text" name="quantity" placeholder="예: 30박스"></div>
        </div>
        <div class="form-grid cols-4" style="margin-top:12px;">
          <div><label>발주일</label><input type="date" name="ordered_at"></div>
          <div><label>도착 예정일</label><input type="date" name="expected_arrival"></div>
          <div style="display:flex;align-items:flex-end;gap:6px;padding-bottom:9px;">
            <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);">
              <input type="checkbox" name="arrived" style="width:auto;"> 도착 완료
            </label>
          </div>
          <div><label>메모</label><input type="text" name="memo"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">저장</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit" style="display:none;">취소</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>전체 발주 목록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>고객/현장</th><th>업체</th><th>품목</th><th>수량</th><th>발주일</th><th>도착예정</th><th>도착여부</th><th></th></tr>
          </thead>
          <tbody id="list-body">
            <tr class="empty-row"><td colspan="8">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin-common.js"></script>
<script>
let editingId = null;
let customersCache = [];

async function loadCustomerOptions() {
  const { data } = await sbClient.from("customers").select("id,name").order("created_at", { ascending: false });
  customersCache = data || [];
  const sel = document.getElementById("customer-select");
  sel.innerHTML = customersCache.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}
function customerName(id) {
  const c = customersCache.find(x => x.id === id);
  return c ? c.name : "-";
}

async function loadList() {
  const { data, error } = await sbClient.from("material_orders").select("*").order("created_at", { ascending: false });
  const tbody = document.getElementById("list-body");
  if (error) { tbody.innerHTML = `<tr class="empty-row"><td colspan="8">불러오기 실패: ${error.message}</td></tr>`; return; }
  if (!data.length) { tbody.innerHTML = `<tr class="empty-row"><td colspan="8">등록된 발주가 없습니다</td></tr>`; return; }
  tbody.innerHTML = data.map(m => `
    <tr>
      <td>${customerName(m.customer_id)}</td>
      <td>${m.vendor_name || "-"}</td>
      <td>${m.item || "-"}</td>
      <td>${m.quantity || "-"}</td>
      <td>${fmtDate(m.ordered_at)}</td>
      <td>${fmtDate(m.expected_arrival)}</td>
      <td>${m.arrived ? '<span class="badge status-계약">도착</span>' : '<span class="badge status-공사중">미도착</span>'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick='editRow(${JSON.stringify(m)})'>수정</button></td>
    </tr>
  `).join("");
}

function editRow(m) {
  editingId = m.id;
  const form = document.getElementById("material-form");
  form.customer_id.value = m.customer_id;
  form.vendor_name.value = m.vendor_name || "";
  form.item.value = m.item || "";
  form.quantity.value = m.quantity || "";
  form.ordered_at.value = m.ordered_at || "";
  form.expected_arrival.value = m.expected_arrival || "";
  form.arrived.checked = !!m.arrived;
  form.memo.value = m.memo || "";
  document.getElementById("form-title").textContent = "발주 내역 수정";
  document.getElementById("submit-btn").textContent = "수정 저장";
  document.getElementById("cancel-edit").style.display = "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  document.getElementById("material-form").reset();
  document.getElementById("form-title").textContent = "새 발주 등록";
  document.getElementById("submit-btn").textContent = "저장";
  document.getElementById("cancel-edit").style.display = "none";
}

(async () => {
  const auth = await requireAuth();
  if (!auth) return;

  await loadCustomerOptions();
  await loadList();

  document.getElementById("cancel-edit").addEventListener("click", resetForm);

  document.getElementById("material-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      customer_id: form.customer_id.value,
      vendor_name: form.vendor_name.value,
      item: form.item.value,
      quantity: form.quantity.value,
      ordered_at: form.ordered_at.value || null,
      expected_arrival: form.expected_arrival.value || null,
      arrived: form.arrived.checked,
      memo: form.memo.value
    };
    let result;
    if (editingId) {
      result = await sbClient.from("material_orders").update(payload).eq("id", editingId);
    } else {
      payload.created_by = auth.user.id;
      result = await sbClient.from("material_orders").insert([payload]);
    }
    if (result.error) { alert("저장 실패: " + result.error.message); return; }
    resetForm();
    loadList();
  });
})();
</script>
</body>
</html>
