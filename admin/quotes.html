<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적서 관리 | 관리자페이지</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="quotes.html">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <h1>견적서 관리</h1>
    <p class="sub" id="page-sub">고객별 간단견적서·상세견적서를 관리합니다</p>

    <div class="card" id="form-card">
      <h2 id="form-title">새 견적서 작성</h2>
      <form id="quote-form">
        <input type="hidden" name="id">
        <div class="form-grid cols-4">
          <div style="grid-column:1/3;"><label>고객 *</label>
            <select name="customer_id" required id="customer-select"></select>
          </div>
          <div><label>견적 종류</label>
            <select name="type">
              <option value="simple">간단견적서</option>
              <option value="detailed">상세견적서</option>
            </select>
          </div>
          <div><label>견적 금액</label><input type="number" name="amount" placeholder="예: 55000000"></div>
        </div>
        <div class="form-grid" style="margin-top:12px;">
          <div style="grid-column:1/3;"><label>상태</label>
            <select name="status">
              <option value="draft">작성중</option>
              <option value="confirmed">확정</option>
            </select>
          </div>
          <div style="grid-column:3/-1;"></div>
        </div>
        <div class="form-grid" style="margin-top:12px;">
          <div style="grid-column:1/-1;"><label>견적 내용 / 메모</label><textarea name="content" rows="3" placeholder="항목별 내역이나 특이사항을 적어주세요"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">저장</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit" style="display:none;">취소</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>전체 견적서 목록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>작성일</th><th>고객</th><th>종류</th><th>금액</th><th>상태</th><th></th></tr>
          </thead>
          <tbody id="list-body">
            <tr class="empty-row"><td colspan="6">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin-common.js"></script>
<script>
let editingId = null;
let isOwner = false;
let customersCache = [];

async function loadCustomerOptions() {
  const { data } = await sbClient.from("customers").select("id,name").order("created_at", { ascending: false });
  customersCache = data || [];
  const sel = document.getElementById("customer-select");
  sel.innerHTML = customersCache.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

function customerName(id) {
  const c = customersCache.find(x => x.id === id);
  return c ? c.name : "-";
}

async function loadList() {
  const { data, error } = await sbClient.from("quotes").select("*").order("created_at", { ascending: false });
  const tbody = document.getElementById("list-body");
  if (error) { tbody.innerHTML = `<tr class="empty-row"><td colspan="6">불러오기 실패: ${error.message}</td></tr>`; return; }
  if (!data.length) { tbody.innerHTML = `<tr class="empty-row"><td colspan="6">등록된 견적서가 없습니다</td></tr>`; return; }
  tbody.innerHTML = data.map(q => `
    <tr>
      <td>${fmtDate(q.created_at)}</td>
      <td>${customerName(q.customer_id)}</td>
      <td>${q.type === "detailed" ? "상세견적서" : "간단견적서"}</td>
      <td>${fmtMoney(q.amount)}</td>
      <td><span class="badge">${q.status === "confirmed" ? "확정" : "작성중"}</span></td>
      <td>${isOwner ? `<button class="btn btn-ghost btn-sm" onclick='editRow(${JSON.stringify(q)})'>수정</button>` : ""}</td>
    </tr>
  `).join("");
}

function editRow(q) {
  editingId = q.id;
  const form = document.getElementById("quote-form");
  form.customer_id.value = q.customer_id;
  form.type.value = q.type || "simple";
  form.amount.value = q.amount || "";
  form.status.value = q.status || "draft";
  form.content.value = q.content || "";
  document.getElementById("form-title").textContent = "견적서 수정";
  document.getElementById("submit-btn").textContent = "수정 저장";
  document.getElementById("cancel-edit").style.display = "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  document.getElementById("quote-form").reset();
  document.getElementById("form-title").textContent = "새 견적서 작성";
  document.getElementById("submit-btn").textContent = "저장";
  document.getElementById("cancel-edit").style.display = "none";
}

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  isOwner = auth.profile.role === "owner";

  if (!isOwner) {
    document.getElementById("form-card").style.display = "none";
    document.getElementById("page-sub").textContent = "견적서는 조회만 가능합니다. 작성·수정은 대표만 할 수 있습니다.";
  }

  await loadCustomerOptions();
  await loadList();

  document.getElementById("cancel-edit").addEventListener("click", resetForm);

  document.getElementById("quote-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      customer_id: form.customer_id.value,
      type: form.type.value,
      amount: form.amount.value || null,
      status: form.status.value,
      content: form.content.value
    };
    let result;
    if (editingId) {
      result = await sbClient.from("quotes").update(payload).eq("id", editingId);
    } else {
      payload.created_by = auth.user.id;
      result = await sbClient.from("quotes").insert([payload]);
    }
    if (result.error) { alert("저장 실패: " + result.error.message); return; }
    resetForm();
    loadList();
  });
})();
</script>
</body>
</html>
