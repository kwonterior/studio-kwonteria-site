<body>

  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-mark.png" alt="스튜디오 권테리어"></a>

</header>

<div class="project-filters" id="project-filters">
  <button data-filter="전체" class="active">전체</button>
  <button data-filter="아파트">아파트</button>
  <button data-filter="주택">주택</button>

<section style="padding-top:32px;">
  <div class="wrap">

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
(async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const grid = document.getElementById("project-grid");
  const { data, error } = await client
    .from("projects")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });

  if (error || !data || !data.length) {
    grid.innerHTML = '<div class="project-card"><div class="ph-image">아직 등록된 시공 사례가 없습니다</div></div>';
    return;
  }

  grid.innerHTML = data.map(p => `
    <div class="project-card" data-category="${p.category || "기타"}">
      <div class="project-card-media">
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${p.title}" onerror="imgFallback(this)">`
          : `<div class="ph-image">사진 준비중</div>`}
        <div class="project-card-overlay">
          <div class="name">${p.title}</div>
          ${p.category ? `<div class="tag">${p.category}</div>` : ""}
        </div>
      </div>
    </div>
  `).join("");

  const filters = document.getElementById("project-filters");
  const cards = () => grid.querySelectorAll(".project-card");
  filters.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      filters.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const f = btn.dataset.filter;
      cards().forEach(card => {
        card.style.display = (f === "전체" || card.dataset.category === f) ? "" : "none";
      });
    });
  });
})();
</script>
</body>
</html>
