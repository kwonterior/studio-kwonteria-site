<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECTS | 스튜디오 권테리어</title>
<meta name="description" content="스튜디오 권테리어의 경주·포항 아파트·주택 시공 사례입니다.">
<link rel="canonical" href="https://www.kwonterior.com/projects.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스튜디오 권테리어">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="PROJECTS | 스튜디오 권테리어">
<meta property="og:description" content="스튜디오 권테리어의 경주·포항 아파트·주택 시공 사례입니다.">
<meta property="og:url" content="https://www.kwonterior.com/projects.html">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HomeAndConstructionBusiness",
  "name": "스튜디오 권테리어",
  "url": "https://www.kwonterior.com/",
  "telephone": "+82-10-7468-0314",
  "priceRange": "₩₩",
  "areaServed": ["경주", "포항"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "용황로8길 18",
    "addressLocality": "경주시",
    "addressRegion": "경상북도",
    "addressCountry": "KR"
  }
}
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-mark.png" alt="스튜디오 권테리어"></a>
    <button class="nav-toggle" aria-label="메뉴 열기">+</button>
  </div>
  <div class="nav-mobile">
    <a href="about.html">ABOUT</a>
    <a href="projects.html" class="active">PROJECTS</a>
    <a href="contact.html">CONTACT</a>
  </div>
</header>

<section style="padding-top:56px;">
  <div class="wrap wrap-wide">
    <div class="project-grid" id="project-grid">
      <div class="project-card"><div class="ph-image">불러오는 중...</div></div>
    </div>
  </div>
</section>

<section style="text-align:center;">
  <div class="wrap">
    <h2 style="margin-bottom:20px;font-size:22px;font-weight:600;">이런 시공, 우리 집에도 가능할까요?</h2>
    <a href="contact.html" class="btn btn-primary">상담 신청하기</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div class="hero-panel-info">
        <div data-name-en-text class="hero-panel-info-name">STUDIO KWONTERIOR</div>
        <div data-address-en-text></div>
        <div>E <span data-email-text></span>&nbsp;&nbsp;&nbsp;P <span data-phone-intl-text></span></div>
        <div>Biz. Reg. No. <span data-biz-text></span></div>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
(async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const grid = document.getElementById("project-grid");
  const { data, error } = await client
    .from("projects")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });

  if (error || !data || !data.length) {
    grid.innerHTML = '<div class="project-card"><div class="ph-image">아직 등록된 시공 사례가 없습니다</div></div>';
    return;
  }

  grid.innerHTML = data.map(p => `
    <a class="project-card" href="project-detail.html?id=${p.id}">
      <div class="project-card-media">
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${p.title}" onerror="imgFallback(this)">`
          : `<div class="ph-image">사진 준비중</div>`}
        <div class="project-card-overlay">
          <div class="name">${p.title}</div>
        </div>
      </div>
    </a>
  `).join("");
})();
</script>
</body>
</html>
