<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECTS | 스튜디오 권테리어</title>
<meta name="description" content="스튜디오 권테리어의 경주·포항 아파트·주택 시공 사례입니다.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">스튜디오 <span>권테리어</span></a>
    <nav class="nav-desktop">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="projects.html" class="active">PROJECTS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <a href="contact.html" class="nav-cta desktop-only">상담 신청</a>
    <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
  </div>
  <div class="nav-mobile">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="projects.html">PROJECTS</a>
    <a href="contact.html">CONTACT</a>
  </div>
</header>

<section class="hero" style="padding-bottom:20px;">
  <div class="wrap">
    <div class="eyebrow">Projects</div>
    <h1>시공 사례</h1>
    <p>경주·포항에서 진행한 아파트·주택 인테리어 시공 사례입니다</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap">
    <div class="project-grid" id="project-grid">
      <div class="project-card"><div class="ph-image">불러오는 중...</div></div>
    </div>
  </div>
</section>

<section style="text-align:center;background:var(--card);">
  <div class="wrap">
    <h2 style="margin-bottom:20px;">이런 시공, 우리 집에도 가능할까요?</h2>
    <a href="contact.html" class="btn btn-primary">상담 신청하기</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div>
        <div style="font-weight:700;margin-bottom:6px;">스튜디오 권테리어</div>
        <div data-address-text></div>
        <div>사업자등록번호 <span data-biz-text></span></div>
      </div>
      <div class="foot-links">
        <a href="tel:" data-tel>전화 상담</a>
        <a href="#" data-kakao target="_blank">카카오톡 상담</a>
      </div>
    </div>
    <div>© 2026 스튜디오 권테리어. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
(async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const grid = document.getElementById("project-grid");
  const { data, error } = await client
    .from("projects")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });

  if (error || !data || !data.length) {
    grid.innerHTML = '<div class="project-card"><div class="ph-image">아직 등록된 시공 사례가 없습니다</div></div>';
    return;
  }

  grid.innerHTML = data.map(p => `
    <div class="project-card">
      ${p.image_url
        ? `<img src="${p.image_url}" alt="${p.title}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;margin-bottom:12px;" onerror="imgFallback(this)">`
        : `<div class="ph-image">사진 준비중</div>`}
      <div class="name">${p.title}</div>
      <div class="tag">${p.category || ""}</div>
    </div>
  `).join("");
})();
</script>
</body>
</html>
