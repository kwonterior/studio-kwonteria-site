<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
(async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const link = document.getElementById("about-video");
  const thumb = document.getElementById("about-video-thumb");
  const { data, error } = await client
    .from("youtube_videos")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false })
    .limit(1);

  if (error || !data || !data.length) return; // 등록된 영상이 없으면 자리 자체가 안 생김

  const m = String(data[0].youtube_url || "").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  const id = m ? m[1] : null;
  if (!id) return;

  thumb.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  link.href = data[0].youtube_url;
  link.style.display = "";
})();
</script>
