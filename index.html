<script>
// 히어로 좌측 사진 캐러셀 (사진이 늘어나도 그대로 동작)
(function () {
  const root = document.getElementById("hero-carousel");
  if (!root) return;
  const slides = root.querySelectorAll(".hero-slide");
  const dots = root.querySelectorAll(".hero-dot");
  if (slides.length < 2) return;
  let i = 0;
  function show(n) {
    i = (n + slides.length) % slides.length;
    slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
    dots.forEach((d, idx) => d.classList.toggle("active", idx === i));
  }
  root.querySelector(".hero-arrow-prev").addEventListener("click", () => show(i - 1));
  root.querySelector(".hero-arrow-next").addEventListener("click", () => show(i + 1));
  dots.forEach((d, idx) => d.addEventListener("click", () => show(idx)));
  setInterval(() => show(i + 1), 6000);
})();

// 유튜브 링크(watch?v=, youtu.be/, shorts/ 형식 모두 지원)에서 영상 ID만 뽑아냄
function extractYoutubeId(url) {
  const m = String(url || "").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

(async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const grid = document.getElementById("home-video-grid");
  const { data, error } = await client
    .from("youtube_videos")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false })
    .limit(4);

  if (error || !data || !data.length) { grid.style.display = "none"; return; } // 등록된 영상이 없으면 자리 자체가 안 생김

  grid.innerHTML = data.map(v => {
    const id = extractYoutubeId(v.youtube_url);
    const thumbHtml = id
      ? `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="스튜디오 권테리어 유튜브 영상">`
      : `<div class="ph-image">영상 준비중</div>`;
    return `
      <a class="video-card" href="${v.youtube_url}" target="_blank" rel="noopener">
        <div class="video-thumb">${thumbHtml}<span class="video-play">▶</span></div>
      </a>`;
  }).join("");
})();
</script>
