<header class="site-header">

    <a href="about.html">ABOUT</a>
    <a href="projects.html">PROJECTS</a>

</header>

<section id="contact-form-section">
  <div class="wrap contact-split">
  <div class="contact-media">
    <iframe data-map-embed title="스튜디오 권테리어 위치" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div class="contact-form-col">
    <div class="inner">
      <form class="inquiry" id="inquiry-form">
        <div class="row">
          <label>이름 <span class="req">*</span></label>
          <input type="text" name="name" placeholder="성함을 입력해주세요." required>
        </div>
        <div class="row">
          <label>연락처 <span class="req">*</span></label>
          <input type="tel" name="phone" placeholder="상담이 가능한 연락처를 알려주세요." required>
        </div>
        <div class="row">
          <label>주소 <span class="req">*</span></label>
          <div class="addr-field">
            <input type="text" id="address-input" placeholder="시공하려는 주소를 알려주세요." readonly required>
            <button type="button" id="address-search-btn">검색</button>
          </div>
        </div>
        <div class="row">
          <label></label>
          <input type="text" id="address-detail-input" placeholder="상세주소를 입력해주세요.">
        </div>
        <div class="row row-select">
          <label>최대 예산 <span class="req">*</span></label>
          <select name="budget" required>
            <option value="" disabled selected>선택하세요.</option>
            <option>3천만원 이하</option>
            <option>3천~5천만원</option>
            <option>5천~8천만원</option>
            <option>8천만원~1억</option>
            <option>1억 이상</option>
            <option>상담 후 결정</option>
          </select>
        </div>
        <div class="row row-select">
          <label>예상 공사 시기 <span class="req">*</span></label>
          <select name="timing" id="timing-select" required>
            <option value="" disabled selected>선택하세요.</option>
          </select>
        </div>
        <div class="row row-select">
          <label>상담 희망 직영점</label>
          <select name="region">
            <option value="" disabled selected>선택하세요.</option>
            <option value="경주 스튜디오">경주 스튜디오</option>
            <option value="포항 라이브러리(준비중)">포항 라이브러리 (준비중)</option>
          </select>
        </div>
        <div class="row">
          <label>문의 내용</label>
          <textarea name="memo" placeholder="궁금하신 점을 남겨주세요."></textarea>
        </div>

        <div class="consent-block">
          <label class="consent-all"><input type="checkbox" id="consent-all"> 약관에 모두 동의합니다</label>
          <label class="consent-item"><input type="checkbox" name="consent_required" class="consent-check" required> 상담을 위한 <a href="#" data-modal="privacy">개인정보 수집과 이용</a> 동의 (필수)</label>
          <label class="consent-item"><input type="checkbox" name="consent_marketing" class="consent-check"> 맞춤형 서비스 제안과 혜택 안내를 위한 <a href="#" data-modal="marketing">마케팅 정보 활용 및 수신</a> 동의 (선택)</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">상담 신청하기</button>
      </form>
    </div>
  </div>
  </div>
</section>

<section id="form-success" style="display:none;">
  <div class="wrap">
    <div class="success-head">
      <div class="success-left">
        <h1>상담 신청 완료</h1>
        <p>신청해주셔서 감사합니다.<br>확인 후 빠르게 연락드리겠습니다.</p>
      </div>
      <div class="success-right">
        <h2>신청 내용</h2>
        <div class="success-field"><span class="k">이름</span><span class="v" id="success-name"></span></div>
        <div class="success-field"><span class="k">연락처</span><span class="v" id="success-phone"></span></div>
        <div class="success-field"><span class="k">주소</span><span class="v" id="success-address"></span></div>
        <div class="success-field"><span class="k">최대 예산</span><span class="v" id="success-budget"></span></div>
      </div>
    </div>
    <div class="success-promo">
      <a class="promo-card" href="projects.html">
        <div class="promo-media"><img src="assets/hero-3.jpg" alt="시공 사례" onerror="imgFallback(this)"></div>
        <div class="promo-text">
          <p>방문 상담 전에<br>다양한 시공 사례를 살펴보세요.</p>
          <span class="btn btn-outline btn-pill">포트폴리오 보기 ›</span>
        </div>
      </a>
      <a class="promo-card" href="about.html">
        <div class="promo-media"><img src="assets/about-photo.jpg" alt="회사 소개" onerror="imgFallback(this)"></div>
        <div class="promo-text">
          <p>권테리어가 궁금하다면<br>우리의 철학을 살펴보세요.</p>
          <span class="btn btn-outline btn-pill">회사 소개 보기 ›</span>
        </div>
      </a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div class="hero-panel-info">
        <div data-name-en-text class="hero-panel-info-name">STUDIO KWONTERIOR</div>
        <div data-address-en-text></div>
        <div>E <span data-email-text></span>&nbsp;&nbsp;&nbsp;P <span data-phone-intl-text></span></div>
        <div>Biz. Reg. No. <span data-biz-text></span></div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
// 예상 공사 시기: 다음달부터 1년치(12개월)를 항상 오늘 날짜 기준으로 채움
(() => {
  const sel = document.getElementById("timing-select");
  const now = new Date();
  for (let i = 1; i <= 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const opt = document.createElement("option");
    opt.textContent = `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
    sel.appendChild(opt);
  }
})();

// 연락처 형식 검사 (숫자만 9~11자리, 0으로 시작해야 유효한 번호로 인정)
(() => {
  const phoneInput = document.querySelector('#inquiry-form input[name="phone"]');
  function validatePhone() {
    const digits = phoneInput.value.replace(/\D/g, "");
    if (!digits || digits.length < 9 || digits.length > 11 || digits[0] !== "0") {
      phoneInput.setCustomValidity("올바른 연락처를 입력해주세요. 예: 010-1234-5678");
    } else {
      phoneInput.setCustomValidity("");
    }
  }
  phoneInput.addEventListener("input", validatePhone);
  phoneInput.addEventListener("blur", validatePhone);
})();

// 주소 검색 (다음 우편번호 서비스)
document.getElementById("address-search-btn").addEventListener("click", openAddressSearch);
document.getElementById("address-input").addEventListener("click", openAddressSearch);
function openAddressSearch() {
  new daum.Postcode({
    oncomplete: (data) => {
      document.getElementById("address-input").value = data.roadAddress || data.jibunAddress;
      document.getElementById("address-detail-input").focus();
    }
  }).open();
}

// "약관에 모두 동의합니다" <-> 개별 체크박스 동기화
const consentAll = document.getElementById("consent-all");
const consentChecks = document.querySelectorAll(".consent-check");
consentAll.addEventListener("change", () => {
  consentChecks.forEach(c => { c.checked = consentAll.checked; });
});
consentChecks.forEach(c => c.addEventListener("change", () => {
  consentAll.checked = Array.from(consentChecks).every(c => c.checked);
}));

// 개인정보 수집/마케팅 동의 안내 (간단 팝업, 새단장 안내와 동일한 방식 재사용)
const modalContent = {
  privacy: {
    title: "개인정보 수집과 이용 동의",
    body: "상담 신청을 위해 이름, 연락처, 주소를 수집하며, 상담 목적 외에는 사용하지 않습니다.<br>상담 완료 후 관련 법령에 따른 보관 기간이 지나면 파기합니다."
  },
  marketing: {
    title: "마케팅 정보 활용 및 수신 동의",
    body: "동의하시면 시공 사례, 이벤트 등 안내를 위해 연락드릴 수 있습니다.<br>선택 항목이며, 동의하지 않으셔도 상담 신청에는 제한이 없습니다."
  }
};
document.querySelectorAll("[data-modal]").forEach(link => {
  link.addEventListener("click", (e) => {
    e.preventDefault();
    const info = modalContent[link.dataset.modal];
    const overlay = document.createElement("div");
    overlay.className = "rn-overlay";
    overlay.innerHTML = `
      <div class="rn-modal" role="dialog" aria-modal="true">
        <button class="rn-close" aria-label="닫기">&times;</button>
        <h2 style="font-size:18px;">${info.title}</h2>
        <p class="rn-desc" style="text-align:left;">${info.body}</p>
        <button class="btn btn-primary rn-confirm">확인</button>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector(".rn-close").addEventListener("click", close);
    overlay.querySelector(".rn-confirm").addEventListener("click", close);
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
  });
});
</script>
</body>
