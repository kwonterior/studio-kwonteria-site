<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT | 스튜디오 권테리어</title>
<meta name="description" content="스튜디오 권테리어 상담 신청 - 경주·포항 아파트·주택 인테리어 문의">
<link rel="canonical" href="https://www.kwonterior.com/contact.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스튜디오 권테리어">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="CONTACT | 스튜디오 권테리어">
<meta property="og:description" content="스튜디오 권테리어 상담 신청 - 경주·포항 아파트·주택 인테리어 문의">
<meta property="og:url" content="https://www.kwonterior.com/contact.html">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HomeAndConstructionBusiness",
  "name": "스튜디오 권테리어",
  "url": "https://www.kwonterior.com/",
  "telephone": "+82-10-7468-0314",
  "priceRange": "₩₩",
  "areaServed": ["경주", "포항"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "용황로8길 18",
    "addressLocality": "경주시",
    "addressRegion": "경상북도",
    "addressCountry": "KR"
  }
}
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-mark.png" alt="스튜디오 권테리어"></a>
    <button class="nav-toggle" aria-label="메뉴 열기">+</button>
  </div>
  <div class="nav-mobile">
    <a href="about.html">ABOUT</a>
    <a href="projects.html">PROJECTS</a>
    <a href="contact.html" class="active">CONTACT</a>
  </div>
</header>

<section class="hero" style="padding-bottom:20px;">
  <div class="wrap">
    <div class="eyebrow">Contact</div>
    <h1>상담 신청</h1>
    <p>편하신 방법으로 문의해주세요. 빠르게 연락드리겠습니다.</p>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap contact-grid">
    <div class="contact-info">
      <div class="item">
        <div class="label">전화</div>
        <div class="value"><a href="tel:" data-tel>📞 <span data-phone-text></span></a></div>
      </div>
      <div class="item">
        <div class="label">카카오톡</div>
        <div class="value"><a href="#" data-kakao target="_blank">💬 카카오톡 채널로 상담하기</a></div>
      </div>
      <div class="item">
        <div class="label">주소</div>
        <div class="value" data-address-text></div>
      </div>
      <div class="item">
        <div class="label">영업시간</div>
        <div class="value">평일 09:00 - 18:00</div>
      </div>
      <div class="item">
        <div class="label">시공 지역</div>
        <div class="value">경주 · 포항</div>
      </div>
    </div>

    <div>
      <form class="inquiry" id="inquiry-form">
        <div class="row">
          <label>성함 *</label>
          <input type="text" name="name" required>
        </div>
        <div class="row">
          <label>연락처 *</label>
          <input type="tel" name="phone" placeholder="010-0000-0000" required>
        </div>
        <div class="row">
          <label>지역</label>
          <select name="region">
            <option value="경주">경주</option>
            <option value="포항">포항</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="row">
          <label>평수</label>
          <input type="text" name="area" placeholder="예: 30평">
        </div>
        <div class="row">
          <label>예상 예산</label>
          <input type="text" name="budget" placeholder="예: 5000만원">
        </div>
        <div class="row">
          <label>문의 내용</label>
          <textarea name="memo" placeholder="공사 예정 시기, 궁금하신 점 등을 남겨주세요"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">상담 신청하기</button>
      </form>
      <div id="form-success">
        <h3 style="margin-top:0;">상담 신청이 접수되었습니다</h3>
        <p style="color:var(--sub);">빠른 시간 내에 연락드리겠습니다. 급하신 경우 전화나 카카오톡으로 문의해주세요.</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div class="hero-panel-info">
        <div data-name-en-text class="hero-panel-info-name">STUDIO KWONTERIOR</div>
        <div data-address-en-text></div>
        <div>E <span data-email-text></span>&nbsp;&nbsp;&nbsp;P <span data-phone-intl-text></span></div>
        <div>Biz. Reg. No. <span data-biz-text></span></div>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
